<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>출동 일지 | 게부장 타임</title>
<meta name="theme-color" content="#1D1E26">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="게부장 타임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&family=East+Sea+Dokdo&family=Song+Myung&family=Gaegu:wght@700&family=Do+Hyeon&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:'Galmuri9';src:url('fonts/galmuri9.woff2') format('woff2');font-display:swap}
@font-face{font-family:'Uiyeun';src:url('fonts/uiyeun.woff2') format('woff2');font-display:swap}
/* =========================================================
   게부장 타임 — 출동 일지 (일정 · 달력)  2026-11-15
   먹색 제복 + 금장 / 글꼴: 주아(이름표·버튼) · 고운돋움(내용·숫자) · 갈무리9(댓글)
   ========================================================= */
:root{--ink:#191513;--paper:#F6F0E2;--paper2:#EDE3CD;--text:#2A221D;--muted:#6A5C4E;--line:rgba(25,21,19,.16);--line2:rgba(25,21,19,.3);
 --selbg:#FBE7DE;--h:#2F3B5C;--g:#F4A9BE;--b:#C8463A;--h-t:#DDE3F0;--g-t:#FCE3EA;--b-t:#F8DAD3;--gold:#C9A75A;--cream:#EFD99C;--bg:#1D1E26;--mayo:#F3D35B;
 --f-ui:'Jua',sans-serif;--f-body:'Gowun Dodum',sans-serif;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden}
body{min-height:100vh;color:#EDE6D6;font:400 15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent;overflow-x:hidden;
 background:radial-gradient(ellipse at 30% 0%,rgba(239,217,156,.10),transparent 55%),repeating-linear-gradient(45deg,rgba(255,255,255,.03) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(0,0,0,.2) 0 2px,transparent 2px 7px),#1D1E26}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
ul{list-style:none;margin:0;padding:0}
dl,dd,figure{margin:0}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hidden{display:none!important}
:focus{outline:none}
:focus-visible{outline:3px solid var(--mayo);outline-offset:2px}
.pipe{position:fixed;top:0;bottom:0;width:9px;border-left:2.5px solid var(--gold);border-right:2.5px solid var(--gold);pointer-events:none;z-index:0}
.pipe.l{left:14px}.pipe.r{right:14px}
.wrap{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding:30px 52px 40px}

/* 맨 위 */
.hd{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:20px}
.desk{justify-self:start;display:inline-flex;align-items:center;gap:3px;height:38px;padding:0 15px 0 10px;border:2.5px solid var(--ink);border-radius:19px;background:var(--paper);color:var(--text);font:400 16px/1 var(--f-ui);text-decoration:none;box-shadow:3px 3px 0 #000;white-space:nowrap}
.desk svg{width:16px;height:16px}
.sign{position:relative;display:flex;flex-direction:column;align-items:center}
.plaque{display:inline-flex;flex-direction:column;align-items:center;padding:10px 34px 14px;background:linear-gradient(#2E3040,#23242F);border:3.5px solid #0B0C10;border-radius:10px;box-shadow:6px 7px 0 #000;position:relative}
.plaque::before{content:"";position:absolute;inset:6px;border:2px solid var(--gold);border-radius:5px;pointer-events:none}
.ttl{margin:0;font:400 76px/1 'East Sea Dokdo',cursive;color:var(--cream);-webkit-text-stroke:1.5px #0B0C10;paint-order:stroke fill;text-shadow:3px 3px 0 #000;position:relative;white-space:nowrap}
.ttl small{font-size:34px;color:var(--mayo);margin-right:6px}
.cute{margin:12px 0 0;font:400 25px/1 'Uiyeun',var(--f-body);color:#F3E2B0;text-shadow:2px 2px 0 #000;text-align:center;letter-spacing:.02em;font-variant-numeric:tabular-nums;white-space:nowrap}
.cute b{font-weight:400;color:#F6A6BD}
.deco{position:absolute;pointer-events:none;display:block}
.deco svg{display:block;width:100%;height:auto;filter:drop-shadow(5px 7px 0 rgba(0,0,0,.55))}
.sign .flag{left:-96px;top:24px;width:58px;transform:rotate(-24deg)}
.sign .ash{right:-210px;top:50px;width:150px;transform:rotate(9deg)}
.legend{justify-self:end;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;padding-top:10px}
.lg{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 14px 0 8px;border:2.5px solid var(--ink);border-radius:20px;font:400 16px/1 var(--f-ui);color:#2A1F1F;box-shadow:2px 2px 0 #000;transition:opacity .15s,filter .15s}
.lg svg{height:26px;width:auto}
.lg.hiji{background:var(--h-t)}.lg.gin{background:var(--g-t)}.lg.both{background:var(--b-t)}
.lg.both svg{height:18px}
.lg[data-who][aria-pressed=false]{opacity:.45;filter:grayscale(.7);box-shadow:none}

/* 몸통 */
.main{display:flex;gap:56px;align-items:flex-start;margin-top:40px}
.lcol{flex:1;min-width:0;position:relative}
.rcol{width:460px;flex-shrink:0;position:relative}
.mbar{display:none}

/* 달력 */
.calwrap{position:relative}
.tape{position:absolute;top:-12px;width:70px;height:22px;background:rgba(239,217,156,.55);border:1.5px solid rgba(0,0,0,.25);pointer-events:none;z-index:2}
.cal{background:var(--paper);border:3px solid var(--ink);border-radius:8px;box-shadow:8px 10px 0 #000;padding:18px 20px 16px;transform:rotate(-.6deg);color:var(--text)}
.cal-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.month{margin:0;font:400 48px/1 'East Sea Dokdo',cursive;display:flex;align-items:baseline;gap:10px;min-width:150px;justify-content:center}
.month .yr{font:700 15px/1 var(--f-body);color:var(--muted)}
.nav{width:40px;height:40px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper2);font:400 22px/1 var(--f-ui);box-shadow:2px 2px 0 #000;display:grid;place-items:center;padding:0}
.todaybtn{margin-left:auto;height:38px;padding:0 15px;border:2.5px solid var(--ink);border-radius:19px;background:var(--paper2);font:400 15px/1 var(--f-ui);box-shadow:2px 2px 0 #000}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font:400 16px/1 'Do Hyeon',sans-serif;color:var(--muted);padding:9px 0;border-bottom:2.5px solid var(--ink)}
.wk .sun{color:#B23A30}.wk .sat{color:var(--h)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cell{position:relative;border:0;border-right:1.5px solid var(--line);border-bottom:1.5px solid var(--line);background:transparent;text-align:left;padding:8px 7px 6px;display:flex;flex-direction:column;gap:4px;min-height:106px;min-width:0;color:var(--text)}
.cell:nth-child(7n){border-right:0}
.grid.r5 .cell:nth-child(n+29),.grid.r6 .cell:nth-child(n+36),.grid.r4 .cell:nth-child(n+22){border-bottom:0}
.cell:hover{background:rgba(201,167,90,.12)}
.num{font:700 16px/1 var(--f-body)}
.cell.sun .num{color:#B23A30}.cell.sat .num{color:var(--h)}
.cell.other .num,.cell.other .chips,.cell.other .dots,.cell.other .sp{opacity:.4}
.cell.sel{background:var(--selbg)}
.cell.sel::after{content:"";position:absolute;inset:3px;border:3px solid var(--b);border-radius:6px;pointer-events:none}
.cell.adding::before{content:"+";position:absolute;right:7px;top:5px;width:22px;height:22px;border-radius:50%;background:#2B2D3A;color:var(--cream);font:400 17px/22px var(--f-ui);text-align:center;z-index:2}
.today{position:absolute;top:6px;right:7px;font:400 11px/1 var(--f-body);background:var(--b);color:#FFF6E6;padding:3px 5px;border-radius:4px}
.cell.adding .today{display:none}
.sp{align-self:flex-start;max-width:100%;overflow:hidden;text-overflow:ellipsis;font:400 12.5px/1 var(--f-ui);color:#4A3600;background:var(--mayo);border:1.8px solid var(--ink);padding:4px 7px 3px;border-radius:10px;white-space:nowrap}
.sp .s{display:none}
.chips{display:flex;flex-direction:column;gap:3px;min-width:0}
.chip{font:400 12.5px/1.25 var(--f-ui);padding:3px 6px 2px;border-radius:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1.6px solid var(--ink)}
.chip.hiji{background:var(--h);color:#fff}.chip.gin{background:var(--g);color:#4A2030}.chip.both{background:var(--b);color:#FFF6E6}
.chip.star::before{content:"★ ";color:var(--mayo)}
.chip.gin.star::before{color:#9A6A00}
.more{font:400 12px/1 var(--f-ui);color:var(--muted);padding-left:2px}
.dots{display:none;gap:3px;justify-content:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;border:1.4px solid var(--ink)}
.dot.hiji{background:var(--h)}.dot.gin{background:var(--g)}.dot.both{background:var(--b)}
.hint{margin:10px 2px 0;font:400 13px/1.4 var(--f-body);color:var(--muted);display:flex;align-items:center;gap:6px}
.hint svg{width:18px;height:18px;flex-shrink:0}

/* 다가오는 특별한 날 */
.up{margin-top:34px}
.up-t{font:400 18px/1 var(--f-ui);color:var(--cream);text-shadow:1.5px 1.5px 0 #000;margin:0 0 12px;display:flex;align-items:center;gap:8px}
.auto{font:400 11px/1 var(--f-body);border:1.5px solid currentColor;padding:3px 5px;border-radius:4px;text-shadow:none}
.up-list{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;padding:0 8px 6px}
.tk{display:flex;flex-direction:column;gap:6px;min-width:0;padding:11px 10px 10px 14px;background:var(--paper);border:2.5px solid var(--ink);border-radius:8px;box-shadow:3px 3px 0 #000;position:relative;color:var(--text)}
.tk::before,.tk::after{content:"";position:absolute;top:50%;width:12px;height:12px;margin-top:-6px;border-radius:50%;background:var(--bg);border:2.5px solid var(--ink)}
.tk::before{left:-8px}.tk::after{right:-8px}
.tk b{font:400 17px/1.1 var(--f-ui);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tk .d{font:400 12.5px/1 var(--f-body);color:var(--muted)}
.tk .dd{font:700 15px/1 var(--f-body);color:#B23A30}
.tk.big{background:var(--mayo)}
.tk.big b,.tk.big .d{color:#3A2A00}

/* 두루마리 */
.roll{position:relative;height:24px;margin:0 -30px;background:linear-gradient(#3A3C4C,#23242F 55%,#121319);border:3px solid #0B0C10;border-radius:12px;box-shadow:4px 5px 0 #000;z-index:1}
.roll::before,.roll::after{content:"";position:absolute;top:-6px;width:18px;height:30px;background:radial-gradient(circle at 35% 30%,#F7E3A8,var(--gold) 58%,#7E6328);border:3px solid #0B0C10;border-radius:6px}
.roll::before{left:-14px}.roll::after{right:-14px}
.panel{background:var(--paper);border:3px solid var(--ink);border-top:0;border-bottom:0;margin:0 -4px;box-shadow:8px 0 0 #000;padding:20px 22px 22px;position:relative;color:var(--text)}
.rep-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-20px -22px 16px;padding:11px 22px;background:#2B2D3A;border-bottom:3px solid var(--ink);color:var(--cream);font:400 17px/1 var(--f-ui);letter-spacing:.02em}
.rep-h span{font:400 13px/1 var(--f-body);color:#CFC7B4;letter-spacing:0}
.day-t{margin:0 0 12px;font:400 22px/1 var(--f-ui);display:flex;align-items:center;gap:8px}
.day-t .n{font:inherit}
.dcount{margin-left:auto;font:400 13px/1 var(--f-body);color:var(--muted)}
.sptags{display:flex;flex-wrap:wrap;gap:6px;margin:-2px 0 12px}
.sptags .sp{font-size:13.5px;padding:5px 9px 4px}
.day-list{display:flex;flex-direction:column;gap:7px}
.it{width:100%;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 12px;border:2.2px solid var(--ink);border-radius:8px;background:var(--paper2);text-align:left;color:var(--text)}
.it .tm{font:400 14px/1 var(--f-body);color:var(--muted);white-space:nowrap}
.it .tt{font:400 16px/1.2 var(--f-ui);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it.on{box-shadow:3px 3px 0 #000;background:var(--b-t)}
.it.new{border-style:dashed;background:transparent;color:var(--muted);justify-content:center;font:400 15px/1 var(--f-ui)}
.empty{margin:0 0 14px;font:400 14px/1.5 var(--f-body);color:var(--muted)}
.who{font:400 12px/1 var(--f-ui);padding:4px 9px 3px;border-radius:10px;border:1.6px solid var(--ink);white-space:nowrap}
.who.hiji{background:var(--h);color:#fff}.who.gin{background:var(--g);color:#4A2030}.who.both{background:var(--b);color:#FFF6E6}
.det{margin-top:18px;padding-top:18px;border-top:2.5px dashed var(--line2);position:relative}
.det-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding-right:78px}
.tag{display:inline-flex;align-items:center;gap:5px;font:400 15px/1 var(--f-ui);padding:5px 11px 4px 7px;border:2px solid var(--ink);border-radius:14px}
.tag svg{width:16px;height:auto;max-height:18px}
.tag.hiji{background:var(--h);color:#fff}.tag.gin{background:var(--g);color:#4A2030}.tag.both{background:var(--b);color:#FFF6E6}
.small-t{font:400 12px/1 var(--f-body);color:var(--muted);border:1.5px solid var(--line2);border-radius:4px;padding:3px 5px}
.small-t.star{background:var(--mayo);color:#3A2A00;border-color:var(--ink)}
.stamp{position:absolute;right:0;top:12px;font:400 25px/1 'East Sea Dokdo',cursive;color:var(--b);border:3px double var(--b);border-radius:50%;width:66px;height:66px;display:grid;place-items:center;transform:rotate(-12deg);opacity:.92;pointer-events:none}
.det-title{margin:12px 0 14px;font:400 28px/1.25 var(--f-ui);word-break:keep-all;overflow-wrap:anywhere}
.info{display:flex;flex-direction:column;gap:9px;font:400 15.5px/1.45 var(--f-body)}
.info div{display:flex;gap:10px;align-items:flex-start}
.info dt{display:flex;color:var(--muted);padding-top:1px}
.info dt svg{width:19px;height:19px}
.photos{display:flex;gap:14px;margin:18px -4px 4px;padding:4px 4px 8px;overflow-x:auto;scrollbar-width:thin}
.pol{background:#fff;padding:7px 7px 8px;border:1.5px solid rgba(0,0,0,.22);box-shadow:3px 4px 0 rgba(0,0,0,.2);width:132px;flex-shrink:0;cursor:zoom-in}
.pol:nth-child(odd){transform:rotate(-2.5deg)}.pol:nth-child(even){transform:rotate(2deg)}
.pol img,.pol .ph{display:block;width:100%;height:112px;object-fit:cover;background:repeating-linear-gradient(45deg,#F1ECE4 0 8px,#E6DFD4 8px 16px)}
.memo{font:400 15.5px/28px var(--f-body);margin:14px 0 0;padding:0 14px;white-space:pre-wrap;overflow-wrap:anywhere;background:repeating-linear-gradient(180deg,transparent 0 27px,var(--line) 27px 28px);border-left:3px solid var(--b)}
.by{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font:400 12.5px/1 var(--f-body);color:var(--muted)}
.by button{border:0;background:none;font:400 14px/1 var(--f-ui);color:var(--muted);padding:0 8px;min-height:36px}
.by button:hover{color:var(--text)}
.cm{margin-top:16px;padding-top:16px;border-top:2.5px dashed var(--line2)}
.cm-t{font:400 19px/1 var(--f-ui);margin:0 0 6px;display:flex;gap:6px;align-items:center}
.cm-t .n{font:400 13px/1 var(--f-body);color:var(--muted)}
.c{display:flex;gap:10px;align-items:flex-start;padding:11px 0 10px;border-bottom:1.5px dashed var(--line2)}
.c:last-child{border-bottom:0}
.av{flex:0 0 36px;height:36px;border:2px solid var(--ink);border-radius:50%;background:#fff;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.cb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.cn{font:400 13px/1 var(--f-ui);display:flex;align-items:center;gap:5px}
.cn time,.cn .ed{font:400 11.5px/1 var(--f-body);color:var(--muted)}
.cn .acts{margin-left:auto;display:flex}
.cn .acts button{border:0;background:none;font:400 12px/1 var(--f-ui);color:var(--muted);padding:4px 6px}
.bub{margin:0;font:400 12px/1.65 'Galmuri9',monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.c-empty{font:400 13px/1.5 var(--f-body);color:var(--muted);padding:6px 0}
.cf{display:flex;gap:8px;margin-top:10px;align-items:center;min-height:48px;padding:0 6px 0 16px;border:2.5px solid var(--ink);border-radius:24px;background:var(--paper2)}
.cf input{flex:1;min-width:0;border:0;background:transparent;font:400 12px/1 'Galmuri9',monospace;outline:0;height:44px}
.cf input::placeholder{color:var(--muted);opacity:1}
.cf button,.cedit button{display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 14px;border:2.2px solid var(--ink);border-radius:18px;background:var(--b);color:#FFF6E6;font:400 15px/1 var(--f-ui);flex-shrink:0}
.cf button svg{width:16px;height:16px}
.cedit{display:flex;gap:6px;margin-top:4px}
.cedit input{flex:1;min-width:0;height:36px;border:2px solid var(--ink);border-radius:8px;padding:0 10px;font:400 12px/1 'Galmuri9',monospace;background:#FFFDF7}
.cedit button.no{background:var(--paper2);color:var(--text)}

/* 일정 적기 */
.fm{display:flex;flex-direction:column;gap:20px}
.fl{display:block;font:400 16px/1 var(--f-ui);margin:0 0 9px;padding:0}
.fl small{font:400 12.5px/1 var(--f-body);color:var(--muted);margin-left:6px}
.who-pick{border:0;padding:0;margin:0;min-width:0}
.who3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.wo{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 6px 9px;border:2.5px solid var(--ink);border-radius:10px;background:var(--paper2);cursor:pointer;font:400 15px/1 var(--f-ui);position:relative}
.wo .ic{height:50px;display:flex;align-items:center;justify-content:center}
.wo .ic img{height:50px;width:auto;display:block}
.wo.on{background:var(--b);color:#FFF6E6;box-shadow:3px 3px 0 #000}
.wo .mk{display:none}
.wo.on .mk{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;background:var(--mayo);color:var(--ink);border:2.2px solid var(--ink);display:grid;place-items:center}
.wo:focus-within{outline:3px solid var(--mayo);outline-offset:2px}
.in{width:100%;height:46px;padding:0 14px;border:2.5px solid var(--ink);border-radius:10px;background:#FFFDF7;font:400 16px/1 var(--f-body);color:var(--text);outline:0;-webkit-appearance:none;appearance:none}
.in::placeholder{font-family:var(--f-ui);color:var(--muted);opacity:1}
.in:focus{box-shadow:0 0 0 3px rgba(243,211,91,.6)}
.flrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px}
.flrow .fl{margin:0}
input[type=date].in,input[type=time].in{display:block;min-width:0;line-height:42px;text-align:left}
input[type=date].in::-webkit-date-and-time-value,input[type=time].in::-webkit-date-and-time-value{text-align:left}
.times{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center;margin-top:10px}
.ta{height:110px;padding:11px 14px;resize:vertical;line-height:1.65;display:block}
.frow{display:flex;gap:10px;align-items:center}
.frow + .frow{margin-top:10px}
.frow .tilde,.times .tilde{font:400 16px var(--f-ui);color:var(--muted)}
.tog{display:inline-flex;align-items:center;gap:8px;font:400 14px/1 var(--f-ui);white-space:nowrap;cursor:pointer}
.sw{width:42px;height:25px;border:2.2px solid var(--ink);border-radius:13px;background:var(--paper2);position:relative;flex-shrink:0;transition:background .15s}

async function q(p){ const { data, error } = await p; if (error) throw error; return data; }

  if (/Failed to fetch|NetworkError|Load failed/i.test(m)) return '인터넷 연결을 확인해 주세요.';

/* ---------- 누가 누구인지 (주인 계정 = 긴토키) ---------- */
function kindOf(uid){
  if (!uid) return 'gin';
  const nm = members[uid] || '';
  if (/히지|토시|부장/.test(nm)) return 'hiji';
  if (/긴|은|해결사/.test(nm)) return 'gin';

}

/* ---------- 일정이 그날에 있는지 (반복 포함) ---------- */
function occurs(ev, k){
  if (k < ev.day) return false;
  if (k === ev.day) return true;
  const a = pk(ev.day), b = pk(k);
  const rep = ev.is_anniv && ev.repeat === 'none' ? 'yearly' : ev.repeat;
  if (rep === 'daily') return true;
  if (rep === 'weekly') return dow(k) === dow(ev.day);
  if (rep === 'monthly') return a.d === b.d;
  if (rep === 'yearly') return a.m === b.m && a.d === b.d;
  return false;
}
const byTime = (x, y) => (y.all_day - x.all_day) || String(x.start_time || '').localeCompare(String(y.start_time || '')) || String(x.created_at).localeCompare(String(y.created_at));
const eventsOn = (k, all) => events.filter(e => (all || filters[e.who]) && occurs(e, k)).sort(byTime);

function renderCal(){

  const rows = Math.ceil((dow(first) + dim) / 7);
  const start = addDays(first, -dow(first)), tk = todayKey();
  let h = '';
  for (let i = 0; i < rows * 7; i++) {
    const k = addDays(start, i), p = pk(k), other = p.m !== viewM;
    const evs = eventsOn(k), sp = autoSpecials(k), dw = i % 7;
    let cls = 'cell' + (other ? ' other' : '') + (dw === 0 ? ' sun' : '') + (dw === 6 ? ' sat' : '') + (k === tk ? ' today-cell' : '') + (k === selKey ? ' sel' : '') + (k === selKey && adding ? ' adding' : '') + (sp.some(s => s.pin) ? ' pin-cell' : '');

  addEventListener('keydown', onKey); document.body.appendChild(el); el.querySelector('button').focus();
}

/* ---------- 댓글 ---------- */
async function loadComments(ev){

function addFiles(list){

// 사진은 올리기 전에 긴 쪽 1600px로 줄여요 (저장 공간 아끼기)
async function shrink(file){

    const img = new Image(); img.src = url; await img.decode();
    const s = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas'); c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

  } finally { URL.revokeObjectURL(url); }
}

  return true;
}
addEventListener('hashchange', () => { if (readHash() && ready && mode !== 'form') { renderAll(); if (isMobile()) $('panel').scrollIntoView({ block: 'start' }); } });

/* ---------- 버튼 연결 ---------- */
$('bellBtn').onclick = openBell;
document.querySelectorAll('.lg[data-who]').forEach(b => {
  b.setAttribute('aria-pressed', filters[b.dataset.who]);
  b.onclick = () => { filters[b.dataset.who] = !filters[b.dataset.who]; b.setAttribute('aria-pressed', filters[b.dataset.who]); try { localStorage.setItem('cal-filters', JSON.stringify(filters)); } catch (e) {} if (mode === 'form') renderCal(); else renderAll(); };
});
$('prevM').onclick = () => { viewM--; if (viewM < 1) { viewM = 12; viewY--; } renderCal(); };
$('nextM').onclick = () => { viewM++; if (viewM > 12) { viewM = 1; viewY++; } renderCal(); };
$('todayBtn').onclick = () => { const t = pk(todayKey()); viewY = t.y; viewM = t.m; if (mode === 'form') renderCal(); else { selKey = todayKey(); selEv = null; renderAll(); } };
$('mBack').onclick = () => { if (fd) closeForm(); };
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !me) return;
  try { sb.auth.startAutoRefresh(); } catch (e) {}
  if (mode !== 'form') { await loadData(); renderAll(); }
});
addEventListener('resize', () => { if (!isMobile()) document.body.classList.remove('m-form'); else if (mode === 'form') document.body.classList.add('m-form'); });

/* ---------- 시작 ---------- */
tick(); setInterval(tick, 1000); renderCal(); renderUp(); renderPanel();
(async function boot(){
  if (!window.supabase) { $('notice').innerHTML = '<p class="notice">일정을 열지 못했어요. 인터넷 연결을 확인해 주세요.</p>'; return; }
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'gebujang-auth', storage: window.localStorage } });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  const { data } = await sb.auth.getSession();
  if (!data || !data.session) { location.replace('index.html'); return; }
  me = data.session.user;
  readHash();
  await loadData(); renderAll();
  if (location.hash && isMobile()) $('panel').scrollIntoView({ block: 'start' });
  // 이미 알림을 켠 기기는 정보를 새로 맞춰 둬요
  if (pushSupport() === 'ok' && 'Notification' in window && Notification.permission === 'granted') { const s = await refreshBell(); if (s) saveSub(s).catch(() => {}); }
})();
})();
</script>
</body>
</html>
