otspot" type="button" data-item="tea" aria-label="찻잔 — 준비 중" data-x="14" data-y="77" data-w="19" data-h="14"><span class="sr-only">찻잔</span></button><button class="hotspot is-live" type="button" data-item="milk" aria-label="딸기우유 · 서재 입장 — 서재로 이동" data-x="79" data-y="54" data-w="29" data-h="27"><span class="sr-only">딸기우유 · 서재 입장</span></button></div></main><p class="instructions"><b>딸기우유</b>를 누르면 서재로 들어갈 수 있어요</p><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
(()=>{
  let timer;
  const toast=document.getElementById('toast');
  const stage=document.querySelector('.stage');
  function positionHotspots(){
    const mobile=matchMedia('(max-width:700px)').matches;
    const scene=document.querySelector('.scene.'+(mobile?'mobile':'desktop'));
    const layer=document.querySelector('.hotspots.'+(mobile?'mobile':'desktop'));
    const width=stage.clientWidth,height=stage.clientHeight;
    const imageW=scene.naturalWidth||1536,imageH=scene.naturalHeight||1024;
    const scale=Math.max(width/imageW,height/imageH);
    const shownW=imageW*scale,shownH=imageH*scale;
    const offsetX=(width-shownW)/2,offsetY=(height-shownH)/2;
    layer.querySelectorAll('.hotspot').forEach(button=>{
      const x=Number(button.dataset.x)/100,y=Number(button.dataset.y)/100;
      const w=Number(button.dataset.w)/100,h=Number(button.dataset.h)/100;
      button.style.left=(offsetX+(x-w/2)*shownW)+'px';
      button.style.top=(offsetY+(y-h/2)*shownH)+'px';
      button.style.width=(w*shownW)+'px';button.style.height=(h*shownH)+'px';
    });
  }
  document.querySelectorAll('.hotspot').forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.dataset.item==='milk'){location.href='library.html';return;}
    toast.textContent='이 소품의 페이지는 아직 준비 중이에요.';toast.classList.add('show');
    clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2400);
  }));
  document.querySelectorAll('.scene').forEach(img=>img.addEventListener('load',positionHotspots));
  addEventListener('resize',positionHotspots);
  positionHotspots();
})();
</script>

  catch(e){errorNode.textContent='연결을 확인하고 다시 시도해 줘.';}
  finally{button.disabled=false;button.textContent='들어가기';}
 });
