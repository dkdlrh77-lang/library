.hotspot .spark{position:absolute;pointer-events:none;line-height:0;filter:drop-shadow(0 0 5px #ffd36e) drop-shadow(0 0 9px #ff9fc0);}.hotspot .spark svg{display:block;width:100%;height:100%}.hotspot .spark{animation:twk 1.8s ease-in-out infinite}
.hotspot .spark.s1{right:16%;top:8%;width:40px;height:40px}
.hotspot .spark.s2{left:6%;top:28%;width:26px;height:26px;animation-delay:-.6s}
.hotspot .spark.s3{right:12%;bottom:14%;width:20px;height:20px;animation-delay:-1.2s}

.hotspot[data-item=calendar] .spark.s1{right:-22px;top:-16px;width:34px;height:34px}
.hotspot[data-item=calendar] .spark.s2{left:-22px;top:38%;width:22px;height:22px}

(()=>{
  let timer;

  const stage=document.querySelector('.stage');
  function positionHotspots(){
    const mobile=matchMedia('(max-width:700px)').matches;
    const scene=document.querySelector('.scene.'+(mobile?'mobile':'desktop'));
    const layer=document.querySelector('.hotspots.'+(mobile?'mobile':'desktop'));
    const width=stage.clientWidth,height=stage.clientHeight;
    const imageW=scene.naturalWidth||(mobile?941:1536),imageH=scene.naturalHeight||(mobile?2040:1024);
    const scale=Math.max(width/imageW,height/imageH);
    const shownW=imageW*scale,shownH=imageH*scale;
    const offsetX=(width-shownW)/2,offsetY=(height-shownH)*(mobile?.5:.15); // PC는 위쪽(달력)이 잘리지 않게 위로 붙임
    layer.querySelectorAll('.hotspot').forEach(button=>{
      const x=Number(button.dataset.x)/100,y=Number(button.dataset.y)/100;
      const w=Number(button.dataset.w)/100,h=Number(button.dataset.h)/100;
      button.style.left=(offsetX+(x-w/2)*shownW)+'px';
      button.style.top=(offsetY+(y-h/2)*shownH)+'px';
      button.style.width=(w*shownW)+'px';button.style.height=(h*shownH)+'px';
    });
  }
  document.querySelectorAll('.hotspot').forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.dataset.item==='milk'){location.href='library.html';return;}
    if(btn.dataset.item==='calendar'){location.href='calendar.html';return;}
    if(btn.dataset.item==='cigarette'){location.href='quest.html';return;}
    toast.textContent='이 소품의 페이지는 아직 준비 중이에요.';toast.classList.add('show');

  }));
  document.querySelectorAll('.scene').forEach(img=>img.addEventListener('load',positionHotspots));
  addEventListener('resize',positionHotspots);
  positionHotspots();
})();

<script>
/* 소품 도움말: 이름표 + 반짝이 */
(()=>{
 const NAMES={lamp:'스탠드',pens:'필통',calendar:'달력',jacket:'부장님 껍질',ashtray:'재떨이',cigarette:'마요보로',milk:'딸기우유',condom:'CD',tea:'찻잔'};
 const GO={milk:'서재',calendar:'일정',cigarette:'퀘스트 로그'};
 document.querySelectorAll('.hotspot').forEach(b=>{
  const k=b.dataset.item,t=document.createElement('span');t.className='tag';t.setAttribute('aria-hidden','true');
  t.innerHTML=GO[k]?NAMES[k]+' → <b>'+GO[k]+'</b>':NAMES[k]+'<small>준비 중</small>';
  b.appendChild(t);
  if(GO[k])b.insertAdjacentHTML('beforeend','<span class="spark s1" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1c.9 6.2 4.8 10.1 11 11-6.2.9-10.1 4.8-11 11-.9-6.2-4.8-10.1-11-11 6.2-.9 10.1-4.8 11-11z" fill="#fff6c8" stroke="#191513" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="spark s2" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1c.9 6.2 4.8 10.1 11 11-6.2.9-10.1 4.8-11 11-.9-6.2-4.8-10.1-11-11 6.2-.9 10.1-4.8 11-11z" fill="#fff6c8" stroke="#191513" stroke-width="1.6" stroke-linejoin="round"/></svg></span><span class="spark s3" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 1c.9 6.2 4.8 10.1 11 11-6.2.9-10.1 4.8-11 11-.9-6.2-4.8-10.1-11-11 6.2-.9 10.1-4.8 11-11z" fill="#fff6c8" stroke="#191513" stroke-width="1.6" stroke-linejoin="round"/></svg></span>');
 });
 // 화면 밖으로 나가는 이름표는 안쪽으로 밀어 넣기
 function fit(){
  document.querySelectorAll('.hotspot .tag').forEach(t=>{
   t.style.setProperty('--nx','0px');
   const b=t.parentElement.getBoundingClientRect(),w=t.offsetWidth,cx=b.left+b.width/2,pad=10;
   let nx=0;if(cx-w/2<pad)nx=pad-(cx-w/2);else if(cx+w/2>innerWidth-pad)nx=(innerWidth-pad)-(cx+w/2);
   t.style.setProperty('--nx',nx+'px');
  });
 }
 const btn=document.getElementById('helpBtn');
 function setHelp(on){document.body.classList.toggle('help-on',on);btn.setAttribute('aria-pressed',on);btn.setAttribute('aria-label',on?'도움말 닫기':'도움말: 소품 이름 보기');if(on){fit();btn.classList.remove('hint');try{localStorage.setItem('desk-help-seen','1')}catch(e){}}}
 btn.addEventListener('click',()=>setHelp(!document.body.classList.contains('help-on')));
 addEventListener('keydown',e=>{if(e.key==='Escape')setHelp(false)});
 addEventListener('resize',()=>{if(document.body.classList.contains('help-on'))requestAnimationFrame(fit)});
 // 한 번도 안 열어 본 사람에겐 '?' 둘레에 점선이 빙글빙글
 try{if(!localStorage.getItem('desk-help-seen'))btn.classList.add('hint')}catch(e){}
})();

<script>
/* 책상 달력: 그림 속 종이(사다리꼴)에 글씨를 맞춰 붙이고 1초마다 갱신 */
(()=>{
 const START=Date.UTC(2026,9,30,17,18,0),KST=9*36e5,DAY=864e5; // 2026-10-31 02:18 한국 시간
 const kday=t=>Math.floor((t+KST)/DAY),pad=n=>String(n).padStart(2,'0');
 const QUAD={d:{img:[1536,1024],pts:[[627,76],[858,76],[866,197],[630,198]]},m:{img:[941,2040],pts:[[404,372],[592,370],[598,512],[410,516]]}};
 function adj(m){return[m[4]*m[8]-m[5]*m[7],m[2]*m[7]-m[1]*m[8],m[1]*m[5]-m[2]*m[4],m[5]*m[6]-m[3]*m[8],m[0]*m[8]-m[2]*m[6],m[2]*m[3]-m[0]*m[5],m[3]*m[7]-m[4]*m[6],m[1]*m[6]-m[0]*m[7],m[0]*m[4]-m[1]*m[3]]}
 function mul(a,b){const c=Array(9);for(let i=0;i<3;i++)for(let j=0;j<3;j++){let t=0;for(let k=0;k<3;k++)t+=a[3*i+k]*b[3*k+j];c[3*i+j]=t}return c}
 function mulv(m,v){return[m[0]*v[0]+m[1]*v[1]+m[2]*v[2],m[3]*v[0]+m[4]*v[1]+m[5]*v[2],m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]}
 function basis(p){const m=[p[0][0],p[1][0],p[2][0],p[0][1],p[1][1],p[2][1],1,1,1];const v=mulv(adj(m),[p[3][0],p[3][1],1]);return mul(m,[v[0],0,0,0,v[1],0,0,0,v[2]])}
 function m3d(w,h,d){const t=mul(basis([d[0],d[1],d[3],d[2]]),adj(basis([[0,0],[w,0],[0,h],[w,h]])));for(let i=0;i<9;i++)t[i]/=t[8];
  return 'matrix3d('+[t[0],t[3],0,t[6],t[1],t[4],0,t[7],0,0,1,0,t[2],t[5],0,t[8]].join(',')+')'}
 const stage=document.querySelector('.stage'),page=document.getElementById('calPage');if(!page)return;
 function place(){
  const mobile=matchMedia('(max-width:700px)').matches,q=QUAD[mobile?'m':'d'];page.classList.toggle('m',mobile);
  const W=stage.clientWidth,H=stage.clientHeight,[iw,ih]=q.img,k=Math.max(W/iw,H/ih),ox=(W-iw*k)/2,oy=(H-ih*k)*(mobile?.5:.15);
  page.style.transform=m3d(page.offsetWidth,page.offsetHeight,q.pts.map(([x,y])=>[ox+x*k,oy+y*k]));
 }
 let last={};
 function tick(){
  const now=Date.now(),ms=Math.max(0,now-START),n=kday(now)-kday(START)+1; // 사귄 날 = 1일째
  const v={'cal-days':n.toLocaleString('ko-KR'),'cal-h':Math.floor(ms/36e5).toLocaleString('ko-KR'),'cal-m':pad(Math.floor(ms/6e4)%60),'cal-s':pad(Math.floor(ms/1e3)%60)};
  for(const c in v){if(last[c]===v[c])continue;last[c]=v[c];page.querySelectorAll('.'+c).forEach(e=>e.textContent=v[c])}
  document.querySelectorAll('.hotspot[data-item=calendar]').forEach(b=>b.setAttribute('aria-label','달력: 사귄 지 '+n+'일째, '+v['cal-h']+'시간 '+v['cal-m']+'분 — 일정으로 이동'));
 }
 tick();setInterval(tick,1000);
 document.querySelectorAll('.scene').forEach(i=>i.addEventListener('load',place));
 addEventListener('resize',place);(document.fonts?document.fonts.ready:Promise.resolve()).then(place);place();
})();
</script>
