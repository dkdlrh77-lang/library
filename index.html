button" data-item="cigarette" aria-label="담배 — 준비 중" data-x="25" data-y="59.2" data-w="42" data-h="21"><span class="sr-only">담배</span></button><button class="hotspot" type="button" data-item="condom" aria-label="포장된 소품 — 준비 중" data-x="66" data-y="79" data-w="62" data-h="21"><span class="sr-only">포장된 소품</span></button><button class="hotspot" type="button" data-item="tea" aria-label="찻잔 — 준비 중" data-x="14" data-y="77" data-w="19" data-h="14"><span class="sr-only">찻잔</span></button><button class="hotspot is-live" type="button" data-item="milk" aria-label="딸기우유 · 서재 입장 — 서재로 이동" data-x="79" data-y="54" data-w="29" data-h="27"><span class="sr-only">딸기우유 · 서재 입장</span></button></div></main><p class="instructions"><b>딸기우유</b>를 누르면 서재로 들어갈 수 있어요</p><div class="toast" id="toast" role="status" aria-live="polite"></div><script>
(()=>{
  let timer;
  const toast=document.getElementById('toast');
  const stage=document.querySelector('.stage');
  function positionHotspots(){
    const mobile=matchMedia('(max-width:700px)').matches;
    const scene=document.querySelector('.scene.'+(mobile?'mobile':'desktop'));
    const layer=document.querySelector('.hotspots.'+(mobile?'mobile':'desktop'));
    const width=stage.clientWidth,height=stage.clientHeight;
    const imageW=scene.naturalWidth||1536,imageH=scene.naturalHeight||1024;
    const scale=Math.max(width/imageW,height/imageH);
    const shownW=imageW*scale,shownH=imageH*scale;
    const offsetX=(width-shownW)/2,offsetY=(height-shownH)/2;
    layer.querySelectorAll('.hotspot').forEach(button=>{
      const x=Number(button.dataset.x)/100,y=Number(button.dataset.y)/100;
      const w=Number(button.dataset.w)/100,h=Number(button.dataset.h)/100;
      button.style.left=(offsetX+(x-w/2)*shownW)+'px';
      button.style.top=(offsetY+(y-h/2)*shownH)+'px';
      button.style.width=(w*shownW)+'px';button.style.height=(h*shownH)+'px';
    });
  }
  document.querySelectorAll('.hotspot').forEach(btn=>btn.addEventListener('click',()=>{
    if(btn.dataset.item==='milk'){location.href='library.html';return;}
    toast.textContent='이 소품의 페이지는 아직 준비 중이에요.';toast.classList.add('show');
    clearTimeout(timer);timer=setTimeout(()=>toast.classList.remove('show'),2400);
  }));
  document.querySelectorAll('.scene').forEach(img=>img.addEventListener('load',positionHotspots));
  addEventListener('resize',positionHotspots);
  positionHotspots();
})();
</script>

<script>
(()=>{
 const form=document.getElementById('deskLoginForm');

 const button=document.getElementById('deskLoginButton');const label=document.getElementById('deskLoginLabel');

 // 서재와 같은 인증 저장소를 사용하여 로그인 상태를 공유합니다.
 if(!window.supabase){errorNode.textContent='인터넷에 연결해야 로그인할 수 있어요.';return;}
 let client;
 try{client=window.supabase.createClient('https://synnujkimpfnyhknnpjl.supabase.co','sb_publishable_KP_w0F5TwVuAGBuVZ2_DpQ_gXEc1_R2',{auth:{persistSession:true,autoRefreshToken:true,storageKey:'gebujang-auth',storage:window.localStorage}});}catch(e){errorNode.textContent='로그인을 불러오지 못했어요. 새로고침해 주세요.';return;}
 client.auth.getSession().then(({data,error})=>{if(!error&&data?.session?.user)unlock();}).catch(()=>{});
 form.addEventListener('submit',async e=>{
  e.preventDefault();let id=document.getElementById('deskLoginId').value.trim();const password=document.getElementById('deskLoginPassword').value;
  if(!id||!password){errorNode.textContent='아이디와 비밀번호를 모두 입력해 줘!';return;}

  button.disabled=true;label.textContent='확인하는 중…';errorNode.textContent='';
  try{const {data,error}=await client.auth.signInWithPassword({email:id.toLowerCase(),password});if(error){errorNode.textContent=/invalid login|invalid credentials/i.test(error.message)?'아이디 또는 비밀번호가 맞지 않아.':'로그인하지 못했어. 다시 시도해 줘.';return;}if(data?.user)unlock();}
  catch(e){errorNode.textContent='연결을 확인하고 다시 시도해 줘.';}
  finally{button.disabled=false;label.textContent='들어가기!';}
 });
})();
</script>
