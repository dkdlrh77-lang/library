<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>퀘스트 로그 | 게부장 타임</title>
<meta name="theme-color" content="#1B1530">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="게부장 타임">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500&family=Jua&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
@font-face{font-family:'Galmuri9';src:url('fonts/galmuri9.woff2') format('woff2');font-display:swap}
@font-face{font-family:'DungGeunMo';src:url('fonts/dunggeunmo.woff2') format('woff2');font-display:swap}
/* =========================================================
   게부장 타임 — 퀘스트 로그 (마요보로)  2026-11-16
   도트 게임 창: 남보라 바탕 + 흰 픽셀 테두리, 갈무리9
   ========================================================= */
:root{--bg:#1B1530;--win:#2A2352;--win2:#3D3270;--ink:#120E24;--line:#F4EEFF;--line2:#7A68C8;--dim:#4E4290;--txt:#F4EEFF;--sub:#C9BFF0;
 --yel:#FFE27A;--yel2:#D9A21A;--pink:#FF8FB0;--pink2:#E2557F;--mint:#9BF0B6;--mint2:#58C57E;--f:'Galmuri9','Jua',sans-serif;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-x:hidden}
body{min-height:100vh;color:var(--txt);font:400 12.5px/1.5 var(--f);-webkit-tap-highlight-color:transparent;overflow-x:hidden;
 background:radial-gradient(circle,rgba(255,255,255,.07) 1px,transparent 1.5px) 0 0/16px 16px,linear-gradient(#251C45,#1B1530 420px) fixed,#1B1530}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
ul{list-style:none;margin:0;padding:0}
img{image-rendering:pixelated}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
:focus{outline:none}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
.wrap{max-width:1344px;margin:0 auto;padding:22px 40px 50px}

/* 공통 부품 */
.win{background:var(--win);border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink),6px 6px 0 3px var(--ink);position:relative}
.win::before{content:"";position:absolute;inset:3px;border:2px solid var(--line2);pointer-events:none}
.wt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 14px 8px;background:var(--win2);border-bottom:3px solid var(--line);font-size:13px;letter-spacing:.04em;color:var(--yel);position:relative}
.wt span{color:var(--sub);font-size:11px;letter-spacing:0}
.in{padding:14px;position:relative}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 14px;background:var(--line);color:var(--bg);border:0;
 box-shadow:inset -3px -3px 0 #B3A6E6,0 0 0 3px var(--ink),4px 4px 0 3px var(--ink);font:400 12px/1.2 var(--f);text-decoration:none;white-space:nowrap}
.btn:active{transform:translate(2px,2px)}
.btn.yel{background:var(--yel);color:#2A1A00;box-shadow:inset -3px -3px 0 var(--yel2),0 0 0 3px var(--ink),4px 4px 0 3px var(--ink)}
.btn.dark{background:var(--win);color:var(--yel);box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px var(--yel)}
.btn.red{background:#E2557F;color:#fff;box-shadow:inset -3px -3px 0 #A8334F,0 0 0 3px var(--ink),4px 4px 0 3px var(--ink)}
.btn:disabled{opacity:.55;cursor:wait}
.tag{display:inline-block;padding:3px 6px 2px;background:var(--ink);border:1.5px solid var(--line2);font-size:10.5px;color:var(--sub);white-space:nowrap}
.tag.xp{border-color:var(--mint2);color:var(--mint)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}
.crumb{font-size:11px;color:var(--sub)}

/* 맨 위 그림 */
.hero{position:relative;overflow:hidden;border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink),6px 6px 0 3px var(--ink);margin-bottom:26px}
.hero img{display:block;width:100%;height:230px;object-fit:cover;object-position:50% 35%;image-rendering:auto}
.hbox{position:absolute;left:20px;bottom:20px;display:flex;flex-direction:column;align-items:flex-start;gap:8px}
.logo{background:rgba(18,14,36,.88);border:2px solid var(--yel);padding:12px 16px 11px}
/* 큰 그림 오른쪽 아래 작은 개수 */
.hst{position:absolute;right:20px;bottom:20px;margin:0;display:flex;gap:10px;background:rgba(18,14,36,.88);border:2px solid var(--line2);padding:5px 10px 4px;font-size:11px;color:var(--sub);white-space:nowrap}
.hst b{font-weight:400;margin-left:4px}
.hst .c b{color:var(--yel)}.hst .d b{color:var(--mint)}.hst .w b{color:#fff}
.logo b{display:block;font:400 30px/1 var(--f);color:var(--yel);letter-spacing:.02em}
.logo small{display:block;font-size:12px;color:var(--txt);margin-top:7px}

/* 배치 */
.qgrid{display:grid;grid-template-columns:320px minmax(0,1fr) 360px;gap:26px;align-items:start}
.mid{display:flex;flex-direction:column;gap:16px;min-width:0}

/* 파티 */
.party{display:flex;gap:10px;align-items:stretch}
.mem{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 7px 9px;background:var(--ink);border:2px solid var(--line2);text-decoration:none;color:inherit}
.mem.me{border-color:var(--yel)}
.mem .pz{height:92px;display:flex;align-items:flex-end;justify-content:center}
.mem .pz .cw{position:relative;display:block;height:92px;max-width:100%}
.mem .pz .pimg{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom;display:block}
.mem .pz .cw.wide{height:auto;width:100%}.mem .pz .cw.wide .pimg{width:100%;height:auto}
.cw .emo,.chara .emo{position:absolute;height:20%;width:auto;transform:translate(-50%,-50%);image-rendering:auto;pointer-events:none}
.mem b{font-weight:400;font-size:12.5px;color:#fff}
.mem .tt{font-size:10.5px;color:var(--sub);text-align:center;line-height:1.3}
.mem .lv{display:flex;justify-content:space-between;width:100%;font-size:11px;color:var(--sub)}
.mem .lv i{font-style:normal;color:var(--yel)}
.bar{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;padding:2px;width:100%;background:var(--ink);border:2px solid var(--line)}
.bar i{height:8px;background:var(--win2)}
.bar i.on{background:var(--pink);box-shadow:inset 0 -3px 0 var(--pink2)}
.rule{margin:0;font-size:10.5px;line-height:1.7;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;text-align:center;font-size:11px;color:var(--sub)}
.stats div{background:var(--ink);border:2px solid var(--dim);padding:7px 0 6px}
.stats b{display:block;font-weight:400;font-size:16px;color:#fff;margin-bottom:4px}

/* 탭 · 칩 */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{flex:1 1 auto;min-height:40px;padding:0 10px;background:var(--win);color:var(--sub);border:0;box-shadow:0 0 0 3px var(--ink),inset 0 0 0 2px var(--line2);font:400 12px/1.2 var(--f);white-space:nowrap}
.tab small{font-size:11px;margin-left:4px;opacity:.85}
/* 탭 빨간 점 = 새로 등록·클리어된 게 있어요 (2026-11-18) */
.tab{position:relative}
.tab .nd{position:absolute;top:-6px;right:-6px;width:14px;height:14px;background:#FF3B5C;box-shadow:0 0 0 2px var(--ink),inset -3px -3px 0 #B8173A,inset 2px 2px 0 #FF9DB0;animation:ndp 1.4s steps(2) infinite}
@keyframes ndp{50%{transform:translateY(-2px)}}
.tab[aria-selected=true]{background:var(--yel);color:#2A1A00;box-shadow:0 0 0 3px var(--ink),inset -3px -3px 0 var(--yel2)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{min-height:30px;padding:0 10px;border:0;background:var(--ink);color:var(--sub);box-shadow:inset 0 0 0 2px var(--dim);font:400 11px/1 var(--f)}
.chip[aria-pressed=true]{background:var(--line);color:var(--bg);box-shadow:0 0 0 2px var(--ink)}

/* 퀘스트 목록 */
.ql{display:flex;flex-direction:column}
.q{display:flex;gap:10px;align-items:center;padding:10px 8px 10px 10px;border-bottom:2px dashed var(--dim);position:relative}
.ql li:last-child .q{border-bottom:0}
.q.sel{background:var(--win2);outline:2px solid var(--yel);outline-offset:-2px}
.q.sel::before{content:"▶";position:absolute;left:-14px;color:var(--yel);font-size:12px}
.qm{flex:1;min-width:0;display:flex;gap:11px;align-items:center;border:0;background:none;padding:0;text-align:left}
.ic{flex-shrink:0;width:42px;height:42px;background:var(--ink);border:2px solid var(--line2);display:grid;place-items:center;color:var(--yel)}
.ic svg{width:24px;height:24px;display:block}
/* 도감: 세로로 긴 작품 사진 칸 */
.ic.tall{width:46px;height:64px}
/* 메인 퀘스트: 가로로 긴 사진 칸 (2026-11-16) */
.ic.wide{width:64px;height:48px}
.ic.pic{padding:0;overflow:hidden}
.tag.day{border-color:var(--yel2);color:var(--yel)}
.dday{display:inline-block;margin-top:9px;padding:5px 9px 4px;background:var(--yel);color:#2A1A00;font-size:12px;box-shadow:0 0 0 2px var(--ink),3px 3px 0 2px var(--ink)}
.epv{font-size:17px;color:#fff;min-width:70px;text-align:center}
.epv small{font-size:12px;color:var(--sub)}
.today{min-height:32px;padding:0 10px;border:0;background:var(--mint);color:#0F3A1E;font:400 11.5px/1 var(--f);box-shadow:0 0 0 2px var(--ink),inset -2px -2px 0 var(--mint2);margin-left:8px}
.today:disabled{background:var(--win2);color:var(--sub);box-shadow:0 0 0 2px var(--ink);cursor:default}
.fdates{display:flex;gap:12px;flex-wrap:wrap}
.fdates>div{flex:1;min-width:150px}
.fin[type=date]{color-scheme:dark}
.pf .pv.wide{width:112px;height:84px}
.ic.pic img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.qt{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.qt h4{margin:0;font:400 13.5px/1.4 var(--f);color:#fff;word-break:keep-all;overflow-wrap:anywhere}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:11px;color:var(--sub)}
.who{display:inline-flex;align-items:center;gap:3px}
.who img{height:20px;width:auto;display:block}
.meta .rt{display:inline-flex;align-items:center;gap:3px}
.meta .rt img{height:18px;width:auto;display:block}
.pg{display:flex;gap:8px;align-items:center;font-size:10.5px;color:var(--mint)}
.pg .t{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:2px;width:120px}
.pg .t i{height:7px;background:var(--win2)}.pg .t i.on{background:var(--mint)}
.st{flex-shrink:0;min-height:34px;padding:0 9px;border:0;font:400 11px/1.2 var(--f);white-space:nowrap}
.st.want{background:var(--win2);color:var(--sub);box-shadow:0 0 0 2px var(--ink),inset 0 0 0 2px var(--line2)}
.st.doing{background:var(--mint);color:#0F3A1E;box-shadow:0 0 0 2px var(--ink),inset -2px -2px 0 var(--mint2)}
.clear{flex-shrink:0;padding:6px 8px 5px;background:var(--yel);color:#2A1A00;font-size:12px;transform:rotate(-8deg);box-shadow:0 0 0 2px var(--ink),3px 3px 0 2px var(--ink)}
.q.done h4{color:#B9B0DE}
.empty{margin:0;padding:18px 6px;font-size:12px;line-height:1.7;color:var(--sub);text-align:center}
.add{width:100%;min-height:46px}

/* 도트 하트 평점 */
.hearts{display:inline-flex;gap:2px;align-items:center}
.hearts svg{width:12px;height:11px;display:block}
.rate{display:flex;flex-direction:column;gap:8px}
.rate .row{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--sub);background:var(--ink);border:2px solid var(--dim);padding:6px 9px}
.rate .row>img{height:30px;width:auto;flex-shrink:0}
.rate .row .nm{min-width:52px}
.rate .hearts svg{width:21px;height:18px}
.rate .hearts.pick{gap:0}
.rate .hearts.pick button{width:36px;height:36px;border:0;background:none;padding:0;display:grid;place-items:center}
.rate .hearts.pick svg{width:26px;height:22px}

/* 상세 */
.detail{position:sticky;top:16px}
.dhead{display:flex;gap:12px;align-items:center}
.dhead .ic{width:54px;height:54px}
.dhead .ic.tall{width:76px;height:106px}
.dhead .ic.wide{width:112px;height:84px}
.dhead h2{margin:0;font:400 17px/1.35 var(--f);color:#fff;word-break:keep-all;overflow-wrap:anywhere}
.dhead p{margin:5px 0 0;font-size:11px;color:var(--sub)}
.lbl{font-size:11px;color:var(--sub);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.lbl span{color:var(--line2)}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg button{min-height:40px;border:0;background:var(--ink);color:var(--sub);font:400 12px/1.2 var(--f);box-shadow:inset 0 0 0 2px var(--dim)}
.seg button[aria-pressed=true]{background:var(--mint);color:#0F3A1E;box-shadow:0 0 0 2px var(--ink),inset -3px -3px 0 var(--mint2)}
.seg button.done[aria-pressed=true]{background:var(--yel);color:#2A1A00;box-shadow:0 0 0 2px var(--ink),inset -3px -3px 0 var(--yel2)}
.dl{display:flex;flex-direction:column;gap:9px;font-size:12px;color:var(--sub)}
.dl div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:2px dotted var(--dim);padding-bottom:8px}
.dl b{font-weight:400;color:#fff;text-align:right}
.dl input[type=date]{height:36px;padding:0 8px;background:var(--ink);border:2px solid var(--line2);color:#fff;font:400 12px/1 var(--f);color-scheme:dark;min-width:0}
.ep{display:flex;align-items:center;gap:8px}
.ep button{width:40px;height:40px;border:0;background:var(--ink);color:var(--yel);font:400 16px/1 var(--f);box-shadow:inset 0 0 0 2px var(--line2)}
.ep input{width:64px;height:40px;padding:0 8px;background:var(--ink);border:2px solid var(--line2);color:#fff;font:400 13px/1 var(--f);text-align:center}
.ep input#epN{border-color:var(--yel);font-size:15px}
/* 메모: 입력칸처럼 안 보이게 그냥 글로 (2026-11-18) — 고치는 건 [수정하기]에서 */
.memo{margin:0;padding:1px 0 1px 11px;border-left:3px solid var(--line2);font-size:12.5px;line-height:1.75;color:#fff;white-space:pre-wrap;overflow-wrap:anywhere;cursor:auto}
.say{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.6;color:#fff}
.say>img{height:40px;width:auto;flex-shrink:0}
.say .bx{flex:1;min-width:0;background:var(--ink);border:2px solid var(--line2);padding:6px 9px 7px}
.say .nm{display:flex;gap:6px;align-items:center;font-size:10.5px;color:var(--sub);margin-bottom:3px}
.say .nm .acts{margin-left:auto;display:flex}
.say .nm .acts button{border:0;background:none;color:var(--sub);font:400 10.5px/1 var(--f);padding:4px 5px}
/* 한마디 글씨 = IBM Plex Sans KR 13px (2026-11-17, 글꼴 시안 ②) */
.say p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font:400 13px/1.6 'IBM Plex Sans KR','Galmuri9',sans-serif}
.cf{display:flex;gap:8px;align-items:flex-end}
.cf input,.cf textarea{flex:1;min-width:0;height:42px;padding:0 10px;background:var(--ink);border:2px solid var(--line2);color:#fff;font:400 12px/1 var(--f)}
.cf textarea{height:auto;min-height:42px;padding:11px 10px 9px;line-height:1.6;resize:none;overflow-y:hidden;display:block}
.cf textarea.tall{min-height:76px}
/* 한마디 입력칸 = IBM Plex Sans KR (2026-11-17) — 아이폰 확대 막으려고 16px 그대로 */
.cf textarea{font:400 16px/1.5 'IBM Plex Sans KR','Galmuri9',sans-serif;padding:10px 10px 8px}
.cf input::placeholder,.cf textarea::placeholder,.fin::placeholder{color:#8C82B8;opacity:1}
.dacts{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.dacts .lnk{border:0;background:none;color:var(--sub);font:400 11.5px/1 var(--f);padding:8px 4px;text-decoration:underline;text-underline-offset:3px}
.mback{display:none}
/* 알림 */
.topl{display:flex;gap:12px;align-items:center}
.btn.bell svg{width:16px;height:16px}
.btn.bell.on{background:var(--yel);color:#2A1A00;box-shadow:inset -3px -3px 0 var(--yel2),0 0 0 3px var(--ink),4px 4px 0 3px var(--ink)}
.ck{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:3px 0}
.ck .box{width:22px;height:22px;flex-shrink:0;background:var(--ink);box-shadow:inset 0 0 0 2px var(--line2);display:grid;place-items:center;color:#2A1A00;font-size:13px}
.ck input:checked + .box{background:var(--yel);box-shadow:0 0 0 2px var(--ink)}
.ck input:focus-visible + .box{outline:3px solid var(--yel);outline-offset:2px}
.ck b{display:block;font-weight:400;font-size:12.5px;color:#fff}
.ck small{display:block;font-size:10.5px;color:var(--sub);margin-top:3px;line-height:1.5}
.warn{margin:0;padding:10px 12px;border:2px solid var(--yel);background:var(--ink);color:var(--yel);font-size:12px;line-height:1.7}

/* 창 (등록·확인·레벨업) */
.dimbg{position:fixed;inset:0;z-index:80;background:rgba(10,7,22,.8);display:grid;place-items:center;padding:18px;overflow-y:auto}
.dlg{width:min(460px,100%)}
.fl{display:block;font-size:11.5px;color:var(--sub);margin:0 0 8px}
.fin{width:100%;height:44px;padding:0 11px;background:var(--ink);border:2px solid var(--line2);color:#fff;font:400 13px/1 var(--f)}
textarea.fin{height:90px;padding:9px 11px;line-height:1.6;resize:vertical}
.ferr{margin:0;font-size:11.5px;color:#FF9DB5}
.ferr:empty{display:none}
.dbtns{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
/* 작품 사진 고르기 */
.pf{display:flex;gap:14px;align-items:flex-end}
.pf .pv{width:76px;height:106px;flex-shrink:0;background:var(--ink);border:2px solid var(--line2);display:grid;place-items:center;overflow:hidden;color:var(--yel)}
.pf .pv svg{width:28px;height:28px}
.pf .pv img{width:100%;height:100%;object-fit:cover;display:block;image-rendering:auto}
.pf .pb{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.pf .pb .btn{min-height:36px;cursor:pointer}
.pf input[type=file]:focus-visible + label{outline:3px solid var(--yel);outline-offset:2px}
.lvup{display:flex;flex-direction:column;align-items:center;gap:12px;padding:22px 18px 20px;text-align:center}
.lvup .big{font-size:34px;color:var(--yel);text-shadow:3px 3px 0 #C2551F,6px 6px 0 var(--ink);letter-spacing:.04em;line-height:1}
.rew{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--ink);border:2px solid var(--dim);font-size:12px;color:#fff;text-align:left;width:100%}
.rew .im{width:46px;height:46px;flex-shrink:0;display:grid;place-items:center;background:var(--win);border:2px solid var(--line2);overflow:hidden;color:var(--yel);font-size:18px}
.rew .im img{max-width:90%;max-height:90%;display:block}
.rew .im img.cover{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;image-rendering:auto}
.rew small{display:block;font-size:10.5px;color:var(--mint);margin-bottom:3px}
.sw{display:inline-block;width:16px;height:16px;border:2px solid var(--ink);vertical-align:-3px;margin-right:4px}
.conf{position:fixed;width:8px;height:8px;z-index:81;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{from{transform:translateY(-30px) rotate(0)}to{transform:translateY(60vh) rotate(260deg);opacity:0}}

.toast{max-width:min(360px,calc(100vw - 32px));background:var(--ink);color:#fff;border:2px solid var(--yel);box-shadow:4px 4px 0 #000;padding:10px 16px;font-size:12.5px;text-align:center;animation:up .16s ease-out}

@keyframes up{from{opacity:0;transform:translateY(6px)}}
.notice{margin:0 0 18px;padding:12px 14px;border:2px solid var(--yel);background:var(--ink);color:var(--yel);font-size:12px;line-height:1.6}

.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:26px;align-items:start}
.stages{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.stwrap{display:flex;flex-direction:column;gap:10px;min-width:0}
.stwrap .cap{font-size:12px;color:var(--sub)}
.stwrap.me .cap{color:var(--yel)}
.stage{position:relative;overflow:hidden;height:440px;border:3px solid var(--line);box-shadow:0 0 0 3px var(--ink),6px 6px 0 3px var(--ink);background:#2A2352}
.stage>.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 60%;filter:saturate(.9) brightness(.82);image-rendering:auto}
.stage.night{background:radial-gradient(circle,rgba(255,255,255,.5) 1px,transparent 1.6px) 0 0/34px 34px,radial-gradient(circle,rgba(255,226,122,.45) 1.2px,transparent 1.8px) 17px 11px/52px 52px,linear-gradient(#251C45,#3D3270)}
.chara{position:absolute;left:50%;bottom:46px;transform:translateX(-50%);height:62%;max-width:90%;display:block}
.chara .pimg{height:100%;width:auto;max-width:100%;object-fit:contain;object-position:bottom;display:block;filter:drop-shadow(0 4px 0 rgba(18,14,36,.6))}
.chara.wide{height:auto;width:82%}.chara.wide .pimg{width:100%;height:auto}
.plate{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);white-space:nowrap;padding:6px 12px 5px;border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);font-size:12px;color:#2A1A00}
.plate small{font-size:10.5px;opacity:.75;margin-right:6px}
.bubble{position:absolute;right:12px;top:14px;max-width:min(170px,60%);background:#FFFDF6;color:var(--bg);border:2px solid var(--ink);box-shadow:3px 3px 0 var(--ink);padding:8px 9px;font-size:11.5px;line-height:1.5;overflow-wrap:anywhere}
.bubble::after{content:"";position:absolute;left:18px;bottom:-9px;width:10px;height:10px;background:#FFFDF6;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg)}
.cinfo{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:11px;color:var(--sub)}
.editor{display:flex;flex-direction:column;gap:20px}
.grid{display:grid;gap:8px}
.opt{position:relative;aspect-ratio:1/1;background:var(--ink);border:2px solid var(--dim);display:grid;place-items:center;overflow:hidden;padding:0}
.opt img{max-width:86%;max-height:86%;display:block}
.opt.bg img{width:100%;height:100%;max-width:none;max-height:none;object-fit:cover;image-rendering:auto}
.opt.solid{background:linear-gradient(#251C45,#3D3270)}
.opt[aria-pressed=true]{border-color:var(--yel);box-shadow:0 0 0 2px var(--yel)}
.opt[aria-pressed=true]::after{content:"E";position:absolute;right:3px;top:3px;width:16px;height:16px;background:var(--yel);color:#2A1A00;font:400 10px/16px var(--f);text-align:center}

async function saveQuest(r, patch, msg){
  const before = xpOf(me.id);
  try {
    patch.updated_at = new Date().toISOString();
    await q(sb.from('quests').update(patch).eq('id', r.id));
    Object.assign(r, patch); afterChange(before, msg);
  } catch (e) { toast(esc(failMsg(e))); renderQuests(); }
}
async function setStatus(r, st){
  if (st === r.status) return;
  if (st === 'done') {
    const ok = await confirmBox('퀘스트 클리어!', '「' + esc(r.title) + '」를 클리어할까요?<br><b style="color:var(--mint);font-weight:400">' + esc(nameOf(me.id)) + ' · ' + esc(partnerName()) + (isDaily(r) ? ' 둘 다 같이 한 ' + playDays(r) + '일 · +' + dayXP(r) + ' EXP 그대로</b><br>모바일·PC게임은 클리어 경험치 없이 [오늘]마다 +' + XP_DAY + '이에요.' : ' 둘 다 +' + xpClear(r) + ' EXP</b>') + (r.kind === 'watch' ? '<br>클리어하면 하트 평점을 매길 수 있어요.' : ''), '클리어!');
    if (!ok) { renderQuests(); return; }
    const patch = { status: 'done', done_at: new Date().toISOString() };
    if (!r.started_at && !isMovie(r)) patch.started_at = patch.done_at;
    if (r.kind === 'watch' && r.ep_total) patch.ep_cur = r.ep_total;
    addMyClear(r.id);   // 내가 클리어한 건 CLEAR 탭 빨간 점에서 빼요
    await saveQuest(r, patch);
    if (r.status === 'done') notify({ type: 'quest', id: r.id, action: 'clear' });
    return;
  }
  if (r.status === 'done' && xpClear(r)) {
    const ok = await confirmBox('클리어 취소', '클리어를 취소하면 둘 다 받은 +' + xpClear(r) + ' EXP가 빠져요. 취소할까요?', '취소하기', true);
    if (!ok) return;
  }
  const patch = { status: st, done_at: null };
  if (st === 'doing' && !r.started_at) patch.started_at = new Date().toISOString();
  if (st === 'doing' && r.kind === 'play' && !r.last_at) patch.last_at = patch.started_at || new Date().toISOString();   // 시작한 날 = 처음 한 날
  if (st === 'want') { patch.started_at = null; if (r.kind === 'play') { if (r.last_at) patch.last_at = null; if (r.ep_cur) patch.ep_cur = 0; } }   // 대기로 돌리면 한 날 수도 0
  saveQuest(r, patch);
}
async function setEp(r, n){
  n = Math.max(0, Math.min(n, 9999));
  const patch = { ep_cur: n };
  if (r.status === 'want' && n > 0) { patch.status = 'doing'; patch.started_at = r.started_at || new Date().toISOString(); }
  await saveQuest(r, patch);
  if (r.ep_total && n >= r.ep_total && r.status !== 'done') setStatus(r, 'done');
}
function quickAct(act, id){
  const r = quests.find(x => x.id === id); if (!r) return;
  if (act === 'start') return setStatus(r, 'doing');
  if (act === 'seen') return setStatus(r, 'done');
  if (act === 'ep') return setEp(r, r.ep_cur + 1);
  if (act === 'next') return setStatus(r, r.status === 'want' ? 'doing' : 'done');
}

/* ---------- 사진 줄이기: 도감 5:7 세로 / 메인 퀘스트 4:3 가로로 잘라 작게 저장 ---------- */
function shrink(file, kind){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      try {
        const wide = kind === 'play', cw = wide ? 320 : 240, ch = wide ? 240 : 336, s = Math.max(cw / im.naturalWidth, ch / im.naturalHeight);
        const w = im.naturalWidth * s, hh = im.naturalHeight * s;
        const c = document.createElement('canvas'); c.width = cw; c.height = ch;
        const x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
        x.fillStyle = '#120E24'; x.fillRect(0, 0, cw, ch);
        x.drawImage(im, (cw - w) / 2, (ch - hh) / 2, w, hh);
        URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    im.src = url;
  });
}

const b64uToU8 = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const b = atob(s), u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };

<div id="ptr" aria-hidden="true" style="position:fixed;left:50%;top:0;z-index:200;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:#191513;border:2.5px solid #fffdf8;box-shadow:0 3px 0 rgba(0,0,0,.35);display:grid;place-items:center;transform:translateY(-60px);opacity:0;pointer-events:none"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fffdf8" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 3v5h-5"/></svg></div>
<style>@keyframes ptrspin{to{transform:rotate(360deg)}}#ptr.go svg{animation:ptrspin .7s linear infinite}#ptr.ready{background:#c8463a}</style>
<script>
(function(){
  var el = document.getElementById('ptr'); if (!el) return;
  var svg = el.querySelector('svg'), y0 = null, x0 = 0, dy = 0, on = false, busy = false, MAX = 120, GO = 75;
  function blocked(t){
    if (busy || window.scrollY > 0) return true;
    if (window.ptrBlock && window.ptrBlock()) return true;              // 화면마다 따로 막을 곳
    var a = document.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return true;
    var s = window.getSelection && window.getSelection(); if (s && !s.isCollapsed) return true;
    for (var n = t; n && n !== document.body && n.nodeType === 1; n = n.parentElement) {
      if (n.scrollTop > 0) return true;                                // 안쪽 칸이 내려가 있으면
      if (getComputedStyle(n).position === 'fixed') return true;       // 창·시트 위에서는 안 함
    }
    return false;
  }
  function show(d){
    var p = Math.min(d, MAX);
    el.style.transition = 'none';
    el.style.opacity = Math.min(1, p / 50);
    el.style.transform = 'translateY(' + (p * .7 - 20) + 'px)';
    svg.style.transform = 'rotate(' + (p * 3) + 'deg)';
    el.classList.toggle('ready', d >= GO);
  }
  function hide(){
    el.style.transition = 'transform .2s, opacity .2s';
    el.style.transform = 'translateY(-60px)'; el.style.opacity = 0; el.classList.remove('ready');
  }
  addEventListener('touchstart', function(e){
    if (e.touches.length !== 1 || blocked(e.target)) { y0 = null; return; }
    y0 = e.touches[0].clientY; x0 = e.touches[0].clientX; dy = 0; on = false;
  }, { passive: true });
  addEventListener('touchmove', function(e){
    if (y0 == null) return;
    var d = e.touches[0].clientY - y0, dx = Math.abs(e.touches[0].clientX - x0);
    if (!on && (d < 10 || dx > d || window.scrollY > 0)) { if (d < 0 || dx > 20) y0 = null; return; }
    on = true; dy = (d - 10) * .6; show(dy);
  }, { passive: true });
  addEventListener('touchend', function(){
    if (y0 == null) return; y0 = null;
    if (on && dy >= GO) {
      busy = true; el.classList.add('go'); el.classList.remove('ready');
      el.style.transition = 'transform .15s'; el.style.transform = 'translateY(28px)';
      try { window.beforePullRefresh && window.beforePullRefresh(); } catch (e) {}
      setTimeout(function(){ location.reload(); }, 250);
    } else hide();
    on = false;
  }, { passive: true });
  addEventListener('touchcancel', function(){ y0 = null; on = false; hide(); }, { passive: true });
})();
</script>
